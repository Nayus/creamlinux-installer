# ARM64 (aarch64) build & release for creamlinux-installer
#
# Runs on GitHub-hosted ARM64 runners (ubuntu-24.04-arm, public preview).
# Everything is native aarch64: Rust, WebKitGTK and the bundlers all run
# without emulation, and the produced .deb/.rpm/AppImage are true arm64.
#
# Changes vs. upstream .github/workflows/build.yml:
#   - runner: ubuntu-24.04-arm
#   - no pinned libwebkit2gtk versions (those pins were x86_64-specific)
#   - no TAURI_SIGNING_* secrets; updater artifact creation is disabled via
#     --config (same trick the project's own package.nix uses)
#   - AppImage keeps the WebKitGTK/GTK/GLib stack bundled by default.
#     Host kernel, libc, graphics drivers and desktop services still matter.
#     "bundle-webkit=false" selects upstream's host-library mode (experimental
#     here; not a verified Fedora fix).
#   - Preserve original AppRun and wrap it to export the DMA-BUF workaround.
#     This keeps GTK hooks, library paths and the original working directory;
#     Fedora GUI compatibility still needs testing on the user's device.
#   - latest.json gains linux-aarch64 platform entries
#
# Manual trigger: Actions -> "Build and Release (ARM64)" -> Run workflow.
# Also un-drafts the release when done.

name: 'Build and Release (ARM64)'

on:
  workflow_dispatch:
    inputs:
      bundle-webkit:
        description: 'Keep bundled WebKitGTK/GTK/GLib (recommended for this build). Uncheck for experimental host-library mode'
        type: boolean
        default: true
      inject-dmabuf-disable:
        description: 'Wrap original AppRun and export WEBKIT_DISABLE_DMABUF_RENDERER=1 (renderer workaround; not a guaranteed white-screen fix)'
        type: boolean
        default: true

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: get version
        id: get-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Package version: $VERSION"

      - name: get changelog notes for version
        id: changelog
        env:
          VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          NOTES="$(awk -v ver="$VERSION" '
            BEGIN { found=0 }
            $0 ~ "^## \\[" ver "\\] - " { found=1 }
            found {
              if ($0 ~ "^## \\[" && $0 !~ "^## \\[" ver "\\] - " ) exit
              print
            }
          ' CHANGELOG.md)"

          if [ -z "$NOTES" ]; then
            echo "No changelog entry found for version $VERSION" >&2
            exit 1
          fi

          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: create draft release
        id: create-release
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.get-version.outputs.version }}
          NOTES: ${{ steps.changelog.outputs.notes }}
        with:
          script: |
            // Reuse the release so rebuilding this version does not fail with
            // "already_exists". Upload uses --clobber below.
            const tag = `v${process.env.VERSION}-arm64`;
            try {
              const { data } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag
              });
              return data.id;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: tag,
              body: process.env.NOTES,
              draft: true,
              prerelease: false
            });
            return data.id;

  build-tauri-arm64:
    needs: create-release
    permissions:
      contents: write
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install system dependencies (Ubuntu arm64)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            pkg-config

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (aarch64, no updater signing)
        env:
          NO_STRIP: 'true'
        run: |
          npm run tauri build -- \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'

      # Keep the complete linuxdeploy startup chain, GTK hooks and its chdir
      # into AppDir/usr. WebKit's patched relative helper paths need that cwd.
      # The renderer flag is a workaround, NOT a Fedora compatibility guarantee.
      - name: Wrap original AppRun with DMA-BUF workaround
        if: ${{ github.event.inputs.inject-dmabuf-disable == 'true' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(src-tauri/target/release/bundle/appimage/*.AppImage)
          [[ ${#images[@]} -eq 1 ]] || { echo 'Expected exactly one AppImage'; exit 1; }
          APPIMAGE=$(realpath "${images[0]}")
          chmod +x "$APPIMAGE"
          WORK_DIR=$(mktemp -d)
          cd "$WORK_DIR"
          "$APPIMAGE" --appimage-extract >/dev/null
          APPDIR_PATH=$(realpath squashfs-root)

          # Verify the exact source/destination before moving the launcher.
          [[ "$APPDIR_PATH" == "$WORK_DIR/squashfs-root" ]]
          test -x "$APPDIR_PATH/AppRun"
          test ! -e "$APPDIR_PATH/AppRun.original"
          test ! -L "$APPDIR_PATH/AppRun.original"
          printf 'Preserve %s as %s\n' "$APPDIR_PATH/AppRun" "$APPDIR_PATH/AppRun.original"
          mv -- "$APPDIR_PATH/AppRun" "$APPDIR_PATH/AppRun.original"
          cat > "$APPDIR_PATH/AppRun" <<'APPRUN_EOF'
          #!/bin/sh
          # Only inject the workaround; the original launcher sets up the app.
          export APPDIR="${APPDIR:-$(CDPATH= cd -- "$(dirname -- "$0")" && pwd -P)}"
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          exec "$APPDIR/AppRun.original" "$@"
          APPRUN_EOF
          chmod +x "$APPDIR_PATH/AppRun"
          sh -n "$APPDIR_PATH/AppRun"

          # Preserve the original runtime rather than silently upgrading it.
          # gzip is also understood by older type-2 runtimes.
          OFFSET=$("$APPIMAGE" --appimage-offset)
          [[ "$OFFSET" =~ ^[0-9]+$ ]] && (( OFFSET > 0 ))
          dd if="$APPIMAGE" of=runtime bs=64K iflag=count_bytes count="$OFFSET" status=none
          curl -fSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-aarch64.AppImage"
          chmod +x appimagetool
          ARCH=aarch64 ./appimagetool --appimage-extract-and-run \
            --runtime-file "$WORK_DIR/runtime" --comp gzip \
            "$APPDIR_PATH" "$WORK_DIR/repacked.AppImage"

          # Inspect the repacked file, not just the input AppDir. Keep the old
          # image until repacking and launcher verification both succeed.
          mkdir verify
          cd verify
          "$WORK_DIR/repacked.AppImage" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun.original
          sh -n squashfs-root/AppRun
          cmp "$APPDIR_PATH/AppRun" squashfs-root/AppRun
          cmp "$APPDIR_PATH/AppRun.original" squashfs-root/AppRun.original
          if [ -e "$APPDIR_PATH/AppRun.wrapped" ]; then
            cmp "$APPDIR_PATH/AppRun.wrapped" squashfs-root/AppRun.wrapped
          fi
          if [ -d "$APPDIR_PATH/apprun-hooks" ]; then
            diff -r "$APPDIR_PATH/apprun-hooks" squashfs-root/apprun-hooks
          fi
          cp "$WORK_DIR/repacked.AppImage" "$APPIMAGE"
          chmod +x "$APPIMAGE"

      # Optional: strip the bundled GTK/WebKit/GLib stack so the AppImage
      # relies on the host's own libraries. Skipped by default (bundle-webkit
      # input defaults to true), which keeps WebKitGTK bundled inside.
      - name: Strip bundled GTK/WebKit/GLib stack, rely on the host's instead
        if: ${{ github.event.inputs.bundle-webkit == 'false' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(src-tauri/target/release/bundle/appimage/*.AppImage)
          [[ ${#images[@]} -eq 1 ]] || { echo 'Expected exactly one AppImage'; exit 1; }
          APPIMAGE=$(realpath "${images[0]}")
          chmod +x "$APPIMAGE"
          WORK_DIR=$(mktemp -d)
          cd "$WORK_DIR"
          "$APPIMAGE" --appimage-extract >/dev/null
          [[ "$(realpath squashfs-root/usr/lib)" == "$WORK_DIR/squashfs-root/usr/lib" ]]

          LDCONFIG_CACHE=$(ldconfig -p)
          resolve_lib_path() {
            awk -v lib="$1" '$1==lib {print $NF; exit}' <<< "$LDCONFIG_CACHE"
          }

          # WebKitGTK bundled by the AppImage tooling is pinned to whatever the
          # build image ships, and drifts out of sync with newer host systems.
          # Defer the whole GTK/WebKit/GLib stack to the host's own libraries.
          declare -A EXCLUDE
          for seed in libwebkit2gtk-4.1.so.0 libglib-2.0.so.0 libgio-2.0.so.0 libgobject-2.0.so.0 libgmodule-2.0.so.0; do
            EXCLUDE[$seed]=1
          done

          changed=1
          while [ "$changed" -eq 1 ]; do
            changed=0
            for lib in "${!EXCLUDE[@]}"; do
              hostpath=$(resolve_lib_path "$lib")
              [ -n "$hostpath" ] && [ -e "$hostpath" ] || continue
              deps=$(ldd "$hostpath" 2>/dev/null | grep -oE '[a-zA-Z0-9._+-]+\.so[0-9.]*' | sort -u) || true
              for d in $deps; do
                if [ -z "${EXCLUDE[$d]:-}" ]; then
                  if find squashfs-root/usr/lib -maxdepth 1 -name "${d}*" 2>/dev/null | grep -q .; then
                    EXCLUDE[$d]=1
                    changed=1
                  fi
                fi
              done
            done
          done

          echo "Excluding ${#EXCLUDE[@]} bundled libraries, relying on the host's instead:"
          for lib in "${!EXCLUDE[@]}"; do echo "  $lib"; done | sort

          for lib in "${!EXCLUDE[@]}"; do
            find squashfs-root/usr/lib -maxdepth 1 -name "${lib%.so*}.so*" -delete
          done

          OFFSET=$("$APPIMAGE" --appimage-offset)
          [[ "$OFFSET" =~ ^[0-9]+$ ]] && (( OFFSET > 0 ))
          dd if="$APPIMAGE" of=runtime bs=64K iflag=count_bytes count="$OFFSET" status=none
          curl -fSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-aarch64.AppImage"
          chmod +x appimagetool
          ARCH=aarch64 ./appimagetool --appimage-extract-and-run \
            --runtime-file "$WORK_DIR/runtime" --comp gzip \
            squashfs-root "$WORK_DIR/repacked.AppImage"
          cp "$WORK_DIR/repacked.AppImage" "$APPIMAGE"
          chmod +x "$APPIMAGE"

      # Structural checks only; this is NOT a Fedora GUI smoke test.
      - name: Inspect final AppImage architecture and startup files
        env:
          BUNDLE_WEBKIT: ${{ github.event.inputs.bundle-webkit }}
          INJECT_DMABUF_DISABLE: ${{ github.event.inputs.inject-dmabuf-disable }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(src-tauri/target/release/bundle/appimage/*.AppImage)
          [[ ${#images[@]} -eq 1 ]] || { echo 'Expected exactly one AppImage'; exit 1; }
          APPIMAGE=$(realpath "${images[0]}")
          cd "$(mktemp -d)"
          "$APPIMAGE" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path('squashfs-root')

          def require_arm64(path):
              header = path.read_bytes()[:20]
              if header[:4] != b'\x7fELF' or header[5] != 1 or int.from_bytes(header[18:20], 'little') != 183:
                  raise RuntimeError(f'Expected AArch64 ELF: {path}')
              if not os.access(path, os.X_OK):
                  raise RuntimeError(f'Not executable: {path}')
              print(f'AArch64 executable: {path}')

          require_arm64(root / 'usr/bin/creamlinux')
          if (root / 'AppRun.wrapped').exists():
              require_arm64(root / 'AppRun.wrapped')
          if os.environ['INJECT_DMABUF_DISABLE'] == 'true':
              assert os.access(root / 'AppRun.original', os.X_OK), 'Missing original launcher'
              wrapper = (root / 'AppRun').read_text()
              assert 'exec "$APPDIR/AppRun.original" "$@"' in wrapper, 'Original launcher is bypassed'
              assert 'export WEBKIT_DISABLE_DMABUF_RENDERER=1' in wrapper, 'Missing workaround'
          if os.environ['BUNDLE_WEBKIT'] == 'true':
              for pattern in ('libwebkit2gtk-4.1.so*', 'libjavascriptcoregtk-4.1.so*', 'libglib-2.0.so*', 'libwebkit2gtkinjectedbundle.so'):
                  paths = [p for p in root.rglob(pattern) if p.is_file()]
                  if not paths:
                      raise RuntimeError(f'Missing bundled WebKit stack: {pattern}')
                  print(f'Bundled {pattern}: {paths}')
              for name in ('WebKitWebProcess', 'WebKitNetworkProcess'):
                  paths = [p for p in root.rglob(name) if p.is_file()]
                  if not paths:
                      raise RuntimeError(f'Missing WebKit subprocess: {name}')
                  for path in paths:
                      require_arm64(path)
          print('Structure checks passed; Fedora desktop execution remains untested.')
          PY

      - name: Upload artifacts to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd src-tauri/target/release/bundle

          APPIMAGE_PATH=$(ls appimage/*.AppImage)
          DEB_PATH=$(ls deb/*.deb)
          RPM_PATH=$(ls rpm/*.rpm)

          APPIMAGE_NAME=$(basename "$APPIMAGE_PATH")
          DEB_NAME=$(basename "$DEB_PATH")
          RPM_NAME=$(basename "$RPM_PATH")

          # No signing key in a fork, so signatures are empty: the updater
          # plugin will simply never verify a payload and auto-update stays
          # disabled. Manual install from these artifacts works normally.
          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --arg appimage_url "https://github.com/$REPO/releases/latest/download/$APPIMAGE_NAME" \
            --arg deb_url "https://github.com/$REPO/releases/latest/download/$DEB_NAME" \
            --arg rpm_url "https://github.com/$REPO/releases/latest/download/$RPM_NAME" \
            '{
              version: $version,
              notes: "",
              pub_date: $pub_date,
              platforms: {
                "linux-aarch64": { signature: "", url: $appimage_url },
                "linux-aarch64-appimage": { signature: "", url: $appimage_url },
                "linux-aarch64-deb": { signature: "", url: $deb_url },
                "linux-aarch64-rpm": { signature: "", url: $rpm_url }
              }
            }' > latest.json

          gh release upload "v${VERSION}-arm64" \
            "$APPIMAGE_PATH" \
            "$DEB_PATH" \
            "$RPM_PATH" \
            latest.json \
            --clobber \
            --repo "$REPO"

  publish-release:
    name: Publish release
    needs: [create-release, build-tauri-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Publish GitHub release (unset draft)
        uses: actions/github-script@v7
        with:
          script: |
            const release_id = Number("${{ needs.create-release.outputs.release_id }}");

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id,
              draft: false
            })
